- type: entity
  parent: BaseItem
  id: ST14MaterialContainer
  name: material container
  description: "A sturdy engineer's tote for hauling sheets of building material."
  components:
  - type: Sprite
    sprite: _ST14/Objects/Specific/Engineering/materialcontainer.rsi
    layers:
    - state: empty_icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: ContainerHeld
    threshold: 1
  - type: Item
    size: Normal
    heldPrefix: empty
    sprite: _ST14/Objects/Specific/Engineering/materialcontainer.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: full_icon }
          False: { state: empty_icon }
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,2
    whitelist:
      tags:
        - Sheet
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  # to prevent bag open/honk spam
  - type: UseDelay
    delay: 0.5
