- type: entity
  parent: ClothingOuterArmorBase
  id: ST14ClothingOuterArmorCombatVest
  name: Mobile Infantry body armor
  description: Standard-issue armor of the Federation trooper. A single-piece chest plate made of flexible composite with a V-shaped ridge, with straps for gear and ammunition along the sides and bottom. Offers some protection against bullets but is nearly useless against Arachnid mandibles.
  components:
  - type: Sprite
    sprite: _ST14/Clothing/OuterClothing/Armor/combatvest.rsi
  - type: Clothing
    sprite: _ST14/Clothing/OuterClothing/Armor/combatvest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.65
        Heat: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.80

- type: entity
  parent: ClothingOuterArmorBase
  id: ST14ClothingOuterArmorMedicalVest
  name: Mobile Medical Infantry body armor
  description: "Medical-pattern armor of the Federation trooper, marked with the corps cross. Lighter plating than the line trooper's kit so a corpsman can keep up with the squad."
  components:
  - type: Sprite
    sprite: _ST14/Clothing/OuterClothing/Armor/medicalvest.rsi
  - type: Clothing
    sprite: _ST14/Clothing/OuterClothing/Armor/medicalvest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.8
        Heat: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.80
