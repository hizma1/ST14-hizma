- type: entity
  parent: ClothingHeadHelmetBase
  id: ST14ClothingHeadHelmetCombat
  name: M-3 tactical helmet
  description: Standard-issue helmet of the Federation trooper, made of the same flexible composite as the body armor. Covers the head and ears and is secured with a chin strap.
  components:
  - type: Sprite
    sprite: _ST14/Clothing/Head/Helmets/combathelmet.rsi
  - type: Clothing
    sprite: _ST14/Clothing/Head/Helmets/combathelmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: HideLayerClothing
    layers:
      Hair: HEAD

