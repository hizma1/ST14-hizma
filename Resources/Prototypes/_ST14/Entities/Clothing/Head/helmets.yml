- type: entity
  parent: ClothingHeadHelmetBase
  id: ST14ClothingHeadCap
  name: Mobile Infantry cap
  description: Grey service cap of the Federation trooper with a short visor. The winged Mobile Infantry emblem is embroidered on the front, with a diamond-shaped number patch below it.
  components:
  - type: Sprite
    sprite: _ST14/Clothing/Head/Helmets/cap.rsi
  - type: Clothing
    sprite: _ST14/Clothing/Head/Helmets/cap.rsi
  - type: HideLayerClothing
    layers:
      Hair: HEAD

