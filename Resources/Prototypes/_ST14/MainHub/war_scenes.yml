# Backgrounds of the "To battle!" screens: mode selection and the galaxy map.
# Layout is taken from GameModeSelectionMenu and TerritoryMissionScreen of Starship Troopers: Terran Command,
# converted to a 1920x1080 canvas with y pointing down. Planets and cards are drawn by ST14WarScreens.cs on top.
# The original shakes the stars and nebulae with its Wiggle script, here they only breathe and slide very slowly.

- type: st14HubScene
  id: ST14HubModes
  layers:
  - id: space
    texture: /Textures/_ST14/Interface/Hub/War/modes_background.png
    anchorMin: 0, 0
    anchorMax: 1, 1
    position: 0, 0
    size: 0, 0
    pivot: 0.5, 0.5
  - id: stars
    texture: /Textures/_ST14/Interface/Hub/War/stars.png
    anchorMin: 0.5, 0.5
    anchorMax: 0.5, 0.5
    position: 0, 0
    size: 2271, 1277.68
    pivot: 0.5, 0.5
    drift:
      offset: 6, 3
      offsetPeriod: 60

